name: Publish qualified alias runtime

on:
  push:
    branches:
      - ci/alias-runtime-publication
  workflow_dispatch:

permissions: {}

concurrency:
  group: qualified-alias-runtime-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rldyourmnd/renovate' && github.ref == 'refs/heads/ci/alias-runtime-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      RUNTIME_SOURCE: 955bc7e6f11f781172eafc8792993d6159eaed10
      RUNTIME_IMAGE: ghcr.io/rldyourmnd/renovate:44.236.4-nddev.1
      MANIFEST_DIGEST: sha256:8854037d7bc43f12f607e659f7fe1797253a7a07e257b2eaa3f9a3ce22f73b49
      CONFIG_DIGEST: sha256:6f181385c10e52bcbd67f77676c52a54408b70fed05ce60aa37020377331668d
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 14201521210
          run-id: 43813227486
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified-runtime
          merge-multiple: true
      - name: Verify the qualified image
        working-directory: ${{ runner.temp }}/qualified-runtime
        run: |
          printf '%s  runtime.oci.tar\n' a4e7cbe311e2c384ff7d14e029d00aeaa5acde8bf6864260bec8b4c81a49a787 | sha256sum --check
          test "$(stat -c '%s' runtime.oci.tar)" = 462621184
          test "$(jq -r .source receipt.json)" = "$RUNTIME_SOURCE"
          test "$(jq -r .version receipt.json)" = 44.236.4-nddev.1
          skopeo inspect --raw "oci-archive:$PWD/runtime.oci.tar:runtime" > verified-manifest.json
          test "sha256:$(sha256sum verified-manifest.json | cut -d' ' -f1)" = "$MANIFEST_DIGEST"
          test "$(jq -r .config.digest verified-manifest.json)" = "$CONFIG_DIGEST"
          skopeo inspect --config "oci-archive:$PWD/runtime.oci.tar:runtime" > verified-config.json
          test "sha256:$(tar -xOf runtime.oci.tar "blobs/sha256/${CONFIG_DIGEST#sha256:}" | sha256sum | cut -d' ' -f1)" = "$CONFIG_DIGEST"
          test "$(jq -r '.config.Labels["org.opencontainers.image.revision"]' verified-config.json)" = "$RUNTIME_SOURCE"
          test "$(jq -r '.config.Labels["org.opencontainers.image.source"]' verified-config.json)" = https://github.com/rldyourmnd/renovate
          test "$(jq -r .os verified-config.json)" = linux
          test "$(jq -r .architecture verified-config.json)" = amd64
      - name: Publish the unchanged image
        working-directory: ${{ runner.temp }}/qualified-runtime
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          umask 077
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$REGISTRY_USER" --password-stdin ghcr.io
          if skopeo inspect --authfile "$REGISTRY_AUTH_FILE" --raw "docker://$RUNTIME_IMAGE" > existing-manifest.json 2> existing-inspect.log; then
            test "sha256:$(sha256sum existing-manifest.json | cut -d' ' -f1)" = "$MANIFEST_DIGEST"
          else
            grep -q 'manifest unknown' existing-inspect.log
            skopeo copy --preserve-digests --dest-authfile "$REGISTRY_AUTH_FILE" \
              "oci-archive:$PWD/runtime.oci.tar:runtime" "docker://$RUNTIME_IMAGE"
          fi
          skopeo inspect --authfile "$REGISTRY_AUTH_FILE" --raw "docker://$RUNTIME_IMAGE" > published-manifest.json
          test "sha256:$(sha256sum published-manifest.json | cut -d' ' -f1)" = "$MANIFEST_DIGEST"
          skopeo inspect --authfile "$REGISTRY_AUTH_FILE" --config "docker://$RUNTIME_IMAGE@$MANIFEST_DIGEST" > published-config.json
          jq --sort-keys . verified-config.json > expected-config.json
          jq --sort-keys . published-config.json > actual-config.json
          cmp expected-config.json actual-config.json
          printf '%s@%s\n' "$RUNTIME_IMAGE" "$MANIFEST_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the owned archive
        if: always()
        env:
          RUNTIME_DIRECTORY: ${{ runner.temp }}/qualified-runtime
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          rm -rf "$RUNTIME_DIRECTORY"
          rm -f "$REGISTRY_AUTH_FILE"
